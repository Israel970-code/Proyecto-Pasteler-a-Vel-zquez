<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Registro</title>

<style>

body{
    font-family: 'Segoe UI', sans-serif;
    background: #fff6f9;
    margin:0;
    padding:0;
}

h1{
    background:#ff8fb1;
    color:white;
    padding:20px;
    text-align:center;
    margin:0;
}

form{
    width:400px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
}

.campo{
    margin-bottom:12px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:5px;
}

button{
    background:#ff8fb1;
    border:none;
    color:white;
    padding:10px;
    width:100%;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#ff6f9a;
}

a{
    display:block;
    text-align:center;
    margin-top:10px;
    color:#555;
    text-decoration:none;
}

</style>
</head>

<body>

<h1>🧁 Registro de usuario</h1>

<form action="/registro" method="post">

    <div class="campo">
        <label>Nombre</label>
        <input type="text" name="nombre" required>
    </div>

    <div class="campo">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>

    <div class="campo">
        <label>Teléfono</label>
        <input type="text" name="telefono" required>
    </div>

    <div class="campo">
        <label>Dirección</label>
        <input type="text" name="direccion" required>
    </div>

    <div class="campo">
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit">Crear cuenta</button>

    <a href="/login">Volver al login</a>

</form>

</body>
</html>
