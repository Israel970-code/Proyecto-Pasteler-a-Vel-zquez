<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

body{
    font-family: 'Segoe UI', sans-serif;
    background: #fff6f9;
    margin:0;
    padding:0;
}

h1{
    background:#ff8fb1;
    color:white;
    padding:20px;
    text-align:center;
    margin:0;
}

form{
    width:350px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:5px;
}

button{
    background:#ff8fb1;
    border:none;
    color:white;
    padding:10px;
    width:100%;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#ff6f9a;
}

a{
    display:block;
    text-align:center;
    margin-top:10px;
    color:#555;
    text-decoration:none;
}

</style>
</head>

<body>

<h1>🍰 Login Pastelería</h1>

<form action="/login" method="post">

    <label>Nombre</label>
    <input type="text" name="nombre">

    <label>Password</label>
    <input type="password" name="password">

    <button type="submit">Entrar</button>

    <a href="/registro">Crear cuenta</a>

</form>

</body>
</html>
